name: Publish Survival Rebalanced

on:
  release:
    types: [edited]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        show-progress: false
      
    - name: Zip the datapack
      # You may pin to the exact commit or the version.
      # uses: TheDoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554
      uses: TheDoctor0/zip-release@0.7.6
      with:
        # Filename for archive
        filename: survival-rebalanced-${{ github.ref_name }}.zip # default is release.zip
        # Base path for archive files
        path: . # optional, default is .
        # Working directory before zipping
        directory: datapack # optional, default is .
        # List of excluded files / directories
        #exclusions: # optional, default is 
        # List of excluded files / directories with recursive wildcards (only applies on Windows with `zip` type)
        #recursive_exclusions: # optional, default is 
        # Provide any custom parameters to the zipping command
        #custom: # optional, default is 
        # Tool to use for archiving
        #type: # optional, default is zip
        # An extra command that will run before zipping
        #command: # optional, default is 

    - name: Publish on Modrinth
      uses: Kira-NT/mc-publish@v3.3.2
      with:
        # If your build toolchain doesn't place the resulting artifacts directly in build/libs/,
        # you will need to manually specify what you want to upload:
        # files: build/libs/fabric/!(*-@(dev|sources|javadoc)).jar

        # 2.2.6-beta+mc26.3
        #name: ${{ github.ref_name }}
        #version: ${{ github.ref_name }}

        loaders: |
          datapack
        environment: server

        game-versions: |
          26.3

        files: |
          datapack/*.zip

        # Only include this section if you wish to publish your assets to Modrinth.
        modrinth-id: jPZFRfGa
        modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

        # Only include this section if you wish to publish your assets to GitHub.
        #github-token: ${{ secrets.GH_TOKEN }}
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
        name: survival-rebalanced-${{ github.ref_name }} # optional, default is artifact
        
        # A file, directory or wildcard pattern that describes what to upload.
        path: *.zip
        
        # The desired behavior if no files are found using the provided path.
        if-no-files-found: error # optional, default is warn
        
        # Duration after which artifact will expire in days. 0 means using default retention.
        # Minimum 1 day. Maximum 90 days unless changed from the repository settings page.
        retention-days: 0 # optional
        
        # The level of compression for Zlib to be applied to the artifact archive. The value can range from 0 to 9: - 0: No compression - 1: Best speed - 6: Default compression (same as GNU Gzip) - 9: Best compression Higher levels will result in better compression, but will take longer to complete. For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.
        #compression-level: # optional, default is 6
        
        # If true, an artifact with a matching name will be deleted before a new one is uploaded. If false, the action will fail if an artifact for the given name already exists. Does not fail if the artifact does not exist.
        #overwrite: # optional, default is false
        
        # If true, hidden files will be included in the artifact. If false, hidden files will be excluded from the artifact.
        #include-hidden-files: # optional, default is false
       
        # If true, the artifact will be archived (zipped) before uploading. If false, the artifact will be uploaded as-is without archiving. When `archive` is `false`, only a single file can be uploaded. The name of the file will be used as the artifact name (ignoring the `name` parameter).
        #archive: # optional, default is true
